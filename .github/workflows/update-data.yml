name: Auto-update Banner & Event Schedule

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write
  actions: write   # deploy.yml workflow_dispatch 트리거에 필요

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 시크릿을 job 환경으로 올려 두면 step의 if 조건에서 존재 여부를 볼 수 있다.
    # 둘 중 하나라도 없으면 Tailscale 연결과 프록시를 건너뛰고 기존 소스만 갱신한다.
    env:
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SYNC_PROXY: ${{ secrets.SYNC_PROXY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Set up Node.js (paimon.moe JS 파싱용)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      # wuwatracker(403)·nikke.gg(429)는 데이터센터 IP를 막는다.
      # 러너를 tailnet에 넣어 사설망의 SOCKS5 프록시로 우회한다.
      # OAuth secret은 tskey-client-<id>-… 형태로 client ID를 품고 있어
      # authkey로 그대로 쓰인다. oauth-client-id는 OIDC 방식에만 필요하다.
      # 프록시 주소가 없으면 tailnet에 붙을 이유가 없으므로 둘 다 있을 때만 연결한다.
      # 프록시는 부가 경로이므로 연결 실패가 나머지 갱신을 막으면 안 된다.
      - name: Connect to Tailscale
        id: tailscale
        if: env.TS_OAUTH_SECRET != '' && env.SYNC_PROXY != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # tailnet 연결이 실패·생략되면 프록시를 쓸 수 없으므로 값을 비운다.
      # 그러면 update_data.py가 차단 소스를 건너뛰고 나머지만 갱신한다.
      - name: Run update script
        id: update
        env:
          SYNC_PROXY: ${{ steps.tailscale.outcome == 'success' && secrets.SYNC_PROXY || '' }}
        run: python scripts/update_data.py

      - name: Commit if changed
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update banner/event schedule"
          file_pattern: "data/games.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # GITHUB_TOKEN 푸시는 push 이벤트 워크플로우를 트리거하지 않으므로 명시적으로 배포 실행
      - name: Trigger Pages deploy if data changed
        if: steps.auto-commit.outputs.changes_detected == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 파서가 조용히 0건을 반환해도 초록불로 끝나던 문제를 막는다.
      # 커밋·배포 뒤에 두어, 정상 파서의 결과는 반영하면서 실패만 드러낸다.
      - name: Fail if any parser returned nothing
        if: steps.update.outputs.failed_count != '0'
        run: |
          echo "::error::파싱 실패/무수확 ${{ steps.update.outputs.failed_count }}개: ${{ steps.update.outputs.failed }}"
          exit 1

      # 프록시를 쓰도록 설정했는데 tailnet에 붙지 못한 경우를 눈에 띄게 남긴다.
      # 데이터는 이미 갱신된 뒤이므로 경고로만 알린다.
      - name: Warn if Tailscale was configured but failed
        if: steps.tailscale.outcome == 'failure'
        run: echo "::warning::Tailscale 연결 실패 — 명조·니케는 이번 실행에서 건너뛰었습니다. TS_OAUTH_SECRET을 확인하세요."

